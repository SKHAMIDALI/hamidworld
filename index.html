<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- tsParticles -->
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

<style>
:root {
    --bg-dark: #193b22;
    --bg-light: #fcfcfc;
    --text-light: #fcfcfc;
    --text-dark: #10240f;
    --accent: #6fbf73;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(to bottom, var(--bg-dark), var(--bg-light));
    transition: background 0.5s ease, color 0.5s ease;
    overflow-x: hidden;
}

body.dark-mode {
    background: linear-gradient(to bottom, #0a1a0d, #101d11);
    color: var(--text-light);
}

/* Menu Bar */
.menu-bar {
    background-color: #193b22;
    display: flex;
    align-items: center;
    padding: 15px 20px;
    position: relative;
    z-index: 20;
}

body.dark-mode .menu-bar {
    background-color: #0a1a0d;
}

.menu-icon {
    color: #fcfcfc;
    font-size: 22px;
    cursor: pointer;
}

.menu-container {
    position: relative;
}

.menu-links {
    display: flex;
    gap: 20px;
    margin-left: 20px;
    opacity: 0;
    transform: translateX(-20px);
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
}

.menu-container:hover .menu-links {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
}

.menu-links a {
    color: #fcfcfc;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 5px;
    transition: 0.3s;
}

.menu-links a:hover {
    background-color: #fcfcfc;
    color: #193b22;
}

.nav-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: #fcfcfc;
    font-size: 20px;
    font-weight: bold;
    pointer-events: none;
}

/* Dark Mode Toggle */
.mode-toggle {
    position: fixed;
    top: 18px;
    right: 24px;
    z-index: 50;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fcfcfc;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.3s ease, background 0.3s ease;
}

.mode-toggle:hover {
    transform: scale(1.1) rotate(15deg);
    background: rgba(255,255,255,0.3);
}

/* Particles background */
#tsparticles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: 1;
}

/* Hero */
.hero {
    position: relative;
    min-height: calc(100vh - 62px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    color: #fcfcfc;
    z-index: 5;
}

.hero-content {
    position: relative;
    z-index: 5;
}

.profile-reveal {
    width: 160px;
    height: 160px;
    margin: 0 auto 24px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.6);
    background: #0f2413 url('image.png') center/cover no-repeat;
    clip-path: circle(0% at 50% 50%);
    animation: revealCircle 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    transform-style: preserve-3d;
    perspective: 600px;
    transition: transform 0.15s ease-out;
}
.profile-reveal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

@keyframes revealCircle {
    to { clip-path: circle(60% at 50% 50%); }
}

.hero h1 {
    font-size: 42px;
    margin: 10px 0;
    letter-spacing: 1px;
}

.typewriter-line {
    font-size: 20px;
    font-weight: 300;
    min-height: 30px;
    display: inline-block;
    border-right: 2px solid #fcfcfc;
    padding-right: 4px;
    white-space: nowrap;
    overflow: hidden;
    animation: blinkCursor 0.75s step-end infinite;
}

@keyframes blinkCursor {
    50% { border-color: transparent; }
}

.page {
    padding: 20px;
    text-align: center;
}

.page p {
    opacity: 0.85;
}

/* Scroll Indicator */
.scroll-indicator {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fcfcfc;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
    z-index: 5;
}

.scroll-indicator i {
    margin-top: 6px;
    font-size: 18px;
    animation: bounceArrow 1.6s ease-in-out infinite;
}

@keyframes bounceArrow {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(10px); }
}

/* Social Links Bar */
.social-bar {
    position: fixed;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 30;
}

.social-bar a {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    color: #fcfcfc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    text-decoration: none;
    transition: all 0.3s ease;
    border: 1px solid rgba(255,255,255,0.25);
}

.social-bar a:hover {
    background: var(--accent);
    color: #0a1a0d;
    box-shadow: 0 0 16px 4px rgba(111, 191, 115, 0.7);
    transform: scale(1.1);
}
</style>
</head>

<body>

<div id="tsparticles"></div>

<button class="mode-toggle" id="modeToggle" aria-label="Toggle dark mode">
    <i class="fas fa-moon" id="modeIcon"></i>
</button>

<!-- MENU BAR -->
<div class="menu-bar">
    <div class="menu-container">
        <i class="fas fa-bars menu-icon"></i>
        <div class="menu-links">
            <a href="about.html">About</a>
            <a href="content.html">Content</a>
            <a href="more.html">More</a>
        </div>
    </div>
    <div class="nav-title">HOME</div>
</div>

<!-- Social bar -->
<div class="social-bar">
    <a href="https://github.com/SKHAMIDALI" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
    <a href="https://linkedin.com/in/yourprofile" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
    <a href="https://twitter.com/yourhandle" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
</div>

<!-- HERO -->
<div class="hero" id="heroSection">
    <div class="hero-content">
        <div class="profile-reveal" id="profileReveal"><img src="mypic.png" alt="My Photo"></div>
        <h1>Hamid</h1>
        <span class="typewriter-line" id="typewriter"></span>
    </div>
    <div class="scroll-indicator">
        Scroll Down
        <i class="fas fa-chevron-down"></i>
    </div>
</div>

<div class="page">
    <p>Hover on the menu icon to open options.</p>
</div>

<script>
// Typewriter effect
const text = "A Computer Science student from Aliah University _KOLKATA_";
const el = document.getElementById('typewriter');
let i = 0;
function typeChar() {
    if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(typeChar, 60);
    }
}
typeChar();

// 3D tilt on profile image
const reveal = document.getElementById('profileReveal');
reveal.addEventListener('mousemove', (e) => {
    const rect = reveal.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top - rect.height / 2;
    const rotateX = (-y / rect.height) * 20;
    const rotateY = (x / rect.width) * 20;
    reveal.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});
reveal.addEventListener('mouseleave', () => {
    reveal.style.transform = 'rotateX(0) rotateY(0)';
});

// Dark mode toggle
const toggleBtn = document.getElementById('modeToggle');
const modeIcon = document.getElementById('modeIcon');
function applyMode(dark) {
    document.body.classList.toggle('dark-mode', dark);
    modeIcon.classList.toggle('fa-moon', !dark);
    modeIcon.classList.toggle('fa-sun', dark);
}
const savedMode = localStorage.getItem('darkMode') === 'true';
applyMode(savedMode);
toggleBtn.addEventListener('click', () => {
    const isDark = !document.body.classList.contains('dark-mode');
    applyMode(isDark);
    localStorage.setItem('darkMode', isDark);
});

// tsParticles background
if (window.tsParticles) {
    tsParticles.load("tsparticles", {
        fullScreen: { enable: false },
        background: { color: { value: "transparent" } },
        fpsLimit: 60,
        particles: {
            number: { value: 60, density: { enable: true, area: 800 } },
            color: { value: "#ffffff" },
            opacity: { value: 0.35 },
            size: { value: 2 },
            links: { enable: true, color: "#ffffff", opacity: 0.15, distance: 130 },
            move: { enable: true, speed: 0.6, outModes: { default: "out" } }
        },
        interactivity: {
            events: { onHover: { enable: true, mode: "grab" } },
            modes: { grab: { distance: 140, links: { opacity: 0.3 } } }
        },
        detectRetina: true
    });
}
</script>

</body>
</html>
